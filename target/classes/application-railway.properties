#  BLACKOUT // Railway production profile
#  Activated when SPRING_PROFILES_ACTIVE=railway
# ============================================================

# PostgreSQL via Railway's DATABASE_URL env var
# Railway provides: postgresql://user:pass@host:port/dbname
# JDBC needs:        jdbc:postgresql://user:pass@host:port/dbname
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false
