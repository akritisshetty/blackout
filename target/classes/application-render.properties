#  BLACKOUT // Render production profile
#  Activated when SPRING_PROFILES_ACTIVE=render
# ============================================================

# PostgreSQL via Render's DATABASE_URL env var
# Render provides: postgresql://user:pass@host:port/dbname
# JDBC needs:       jdbc:postgresql://user:pass@host:port/dbname
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false
