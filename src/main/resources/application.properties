# ============================================================
#  BLACKOUT // embedded relay configuration
#  Bound to loopback only - this network never leaves the machine.
# ============================================================

server.address=127.0.0.1
server.port=8080

spring.application.name=blackout-relay
spring.main.banner-mode=off
spring.main.web-application-type=servlet

# In-memory H2 - every shutdown buries the evidence.
spring.datasource.url=jdbc:h2:mem:blackoutdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Field intel console for the database itself
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.root=INFO
logging.level.com.blackout=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
